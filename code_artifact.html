<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福喜宴 - 桌次與座位查詢系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Serif TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wedding: {
                            wine: '#7A1C32',
                            wineDark: '#5E1324',
                            gold: '#D4AF37',
                            goldLight: '#F3E5AB',
                            rose: '#F9F1F2',
                            roseAccent: '#E8C5C8',
                            darkText: '#2D2D2D'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Serif TC', sans-serif;
            background-color: #FAF6F6;
            color: #2D2D2D;
        }
        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .gold-glow:focus {
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.3);
            border-color: #D4AF37;
        }

        /* 座位地圖亮燈閃爍效果 */
        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(122, 28, 50, 0.7);
            }
            70% {
                transform: scale(1.15);
                box-shadow: 0 0 0 12px rgba(122, 28, 50, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(122, 28, 50, 0);
            }
        }

        .table-node {
            transition: all 0.25s ease-in-out;
            cursor: pointer;
        }

        .table-node:hover {
            transform: scale(1.12);
            z-index: 20;
        }

        .table-node.active-highlight {
            background-color: #7A1C32 !important;
            color: #F3E5AB !important;
            border-color: #D4AF37 !important;
            z-index: 30;
            animation: pulse-ring 1.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-wedding-gold selection:text-white">

    <!-- 頂部喜氣橫幅 -->
    <header class="bg-gradient-to-r from-wedding-wineDark via-wedding-wine to-wedding-wineDark text-white shadow-lg relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#D4AF37_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="max-w-5xl mx-auto px-4 py-8 text-center relative z-10">
            <div class="inline-flex items-center justify-center space-x-2 mb-2 text-wedding-goldLight">
                <i class="fa-solid fa-heart text-sm animate-pulse"></i>
                <span class="tracking-widest uppercase text-xs font-semibold">Wedding Seating Query</span>
                <i class="fa-solid fa-heart text-sm animate-pulse"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold tracking-wide text-wedding-goldLight mb-2">
                &mdash; 劉彭喜宴 座位導引 &mdash;
            </h1>
            <p class="text-sm sm:text-base text-wedding-rose opacity-90 font-light">
                尋找您的專屬席位，共享喜悅時刻
            </p>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 space-y-8">
        
        <!-- 搜尋列與功能按鈕 -->
        <div class="bg-white rounded-2xl shadow-md p-6 gold-border relative">
            <div class="absolute -top-3 left-6 bg-wedding-wine text-wedding-goldLight px-3 py-0.5 rounded-full text-xs font-serif tracking-wider shadow">
                快速查詢
            </div>
            
            <div class="mt-2 flex flex-col md:flex-row gap-4 items-center justify-between">
                <!-- 搜尋輸入框 -->
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-wedding-wine">
                        <i class="fa-solid fa-magnifying-glass text-lg"></i>
                    </span>
                    <input type="text" id="searchInput" 
                        class="w-full pl-12 pr-10 py-3.5 bg-wedding-rose/50 border border-wedding-roseAccent rounded-xl text-wedding-darkText placeholder-gray-400 focus:outline-none gold-glow transition text-base sm:text-lg"
                        placeholder="請輸入姓名、桌名或桌次（例如：劉家齊、主桌、第15桌）...">
                    <button id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-wedding-wine hidden">
                        <i class="fa-solid fa-circle-xmark text-lg"></i>
                    </button>
                </div>

                <!-- 資料管理按鈕 -->
                <div class="flex items-center gap-2 w-full md:w-auto justify-end flex-shrink-0">
                    
                    <button onclick="resetToDefault()" title="恢復預設範例" class="p-3 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl text-sm transition" aria-label="恢復預設範例">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- 搜尋提示小標 -->
            <div class="mt-3 flex items-center justify-between text-xs text-gray-500 px-1">
                <span id="searchStats">提示：可輸入任意關鍵字，系統會即時過濾符合的賓客，地圖桌次會自動連動變色。</span>
                <span id="totalSeatingCount" class="font-medium text-wedding-wine"></span>
            </div>
        </div>

        <!-- 會場平面座位圖 (無底圖向量版) -->
        <section class="bg-white rounded-2xl p-6 shadow-md gold-border">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-serif font-bold text-wedding-wine flex items-center">
                    <i class="fa-solid fa-map-location-dot mr-2 text-wedding-gold"></i>喜宴會場平面座位圖
                </h2>
                <div class="text-xs text-gray-500 flex items-center space-x-3">
                    <span class="inline-flex items-center"><span class="w-3 h-3 rounded-full bg-wedding-wine inline-block mr-1"></span> 高亮桌次</span>
                    <span class="inline-flex items-center"><span class="w-3 h-3 rounded-full bg-white border border-gray-400 inline-block mr-1"></span> 一般桌次</span>
                </div>
            </div>

            <!-- 畫布容器 -->
            <div class="overflow-x-auto pb-2">
                <div class="relative w-full min-w-[720px] bg-gray-50 border border-gray-200 rounded-xl p-4 overflow-hidden" style="aspect-ratio: 1000/520;">
                    
                    <!-- SVG 繪製場地格局背景 -->
                    <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1000 520" preserveAspectRatio="none">
                        <rect x="20" y="20" width="960" height="480" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6,6" />
                        
                        <!-- 舞台區 -->
                        <rect x="25" y="180" width="40" height="150" fill="#F3E5AB" stroke="#D4AF37" stroke-width="1.5" rx="4" />
                        <text x="45" y="260" font-size="14" font-weight="bold" fill="#7A1C32" text-anchor="middle" writing-mode="tb">舞台 Stage</text>
                        
                        <!-- 司儀台 -->
                        <rect x="75" y="130" width="35" height="25" fill="#E8C5C8" stroke="#7A1C32" stroke-width="1" rx="2" />
                        <text x="92" y="146" font-size="10" fill="#2D2D2D" text-anchor="middle">司儀台</text>

                        <!-- L型紅地毯 Red Carpet -->
                        <path d="M 140 185 L 435 185 L 435 440 L 400 440 L 400 220 L 140 220 Z" fill="#7A1C32" opacity="0.85" />
                        <text x="280" y="206" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">紅 地 毯  Red Carpet</text>

                        <!-- 喜餅/雙方收禮桌 -->
                        <rect x="445" y="445" width="45" height="22" fill="#E8C5C8" stroke="#7A1C32" stroke-width="1" rx="2" />
                        <text x="467" y="460" font-size="9" fill="#2D2D2D" text-anchor="middle">喜餅桌</text>

                        <rect x="500" y="445" width="70" height="22" fill="#E8C5C8" stroke="#7A1C32" stroke-width="1" rx="2" />
                        <text x="535" y="460" font-size="9" fill="#2D2D2D" text-anchor="middle">雙方收禮桌</text>
                        
                        <rect x="430" y="482" width="70" height="18" fill="#F3E5AB" stroke="#D4AF37" stroke-width="1" rx="2" />
                        <text x="465" y="495" font-size="9" fill="#7A1C32" text-anchor="middle">迎賓雞尾酒區</text>
                    </svg>

                    <!-- 桌次圓圈 HTML 層 -->
                    <div id="mapNodesContainer" class="absolute inset-0 w-full h-full"></div>
                </div>
            </div>
            <p class="text-xs text-gray-400 mt-2 text-right">※ 點擊圖上任意桌號圓圈，可自動篩選該桌賓客。</p>
        </section>

        <!-- 搜尋結果顯示區 -->
        <section>
            <div class="flex items-center justify-between mb-4 px-1">
                <h2 class="text-lg font-serif font-bold text-wedding-wine flex items-center">
                    <i class="fa-solid fa-list-ul mr-2 text-wedding-gold"></i>桌次座位列表
                </h2>
                <div id="resultCountBadge" class="text-xs bg-wedding-wine/10 text-wedding-wine px-2.5 py-1 rounded-full font-medium">
                    顯示全部
                </div>
            </div>

            <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <!-- 動態生成的卡片會放在這裡 -->
            </div>

            <!-- 無搜尋結果提示 -->
            <div id="noResults" class="hidden bg-white rounded-2xl p-12 text-center shadow-sm gold-border">
                <div class="w-16 h-16 bg-wedding-rose text-wedding-wine rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-face-frowning"></i>
                </div>
                <h3 class="text-lg font-bold text-wedding-darkText mb-1">找不到相關賓客或桌次</h3>
                <p class="text-sm text-gray-500 mb-4">請嘗試其他關鍵字，或確認輸入的姓名是否正確。</p>
                <button onclick="clearSearch()" class="px-4 py-2 bg-wedding-wine text-white text-sm rounded-xl shadow hover:bg-wedding-wineDark transition">
                    清除搜尋條件
                </button>
            </div>
        </section>

    </main>

    <!-- 編輯/匯入資料 Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-wedding-gold/30">
            <div class="bg-wedding-wine text-white px-6 py-4 flex items-center justify-between">
                <h3 class="font-serif font-bold text-lg text-wedding-goldLight flex items-center">
                    <i class="fa-solid fa-database mr-2"></i>編輯與匯入婚宴資料
                </h3>
                <button onclick="closeEditModal()" class="text-wedding-goldLight hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-grow">
                <div class="bg-wedding-rose/60 p-4 rounded-xl text-xs text-wedding-darkText leading-relaxed border border-wedding-roseAccent">
                    <p class="font-semibold text-wedding-wine mb-1"><i class="fa-solid fa-circle-info mr-1"></i>格式說明：</p>
                    <p>每行代表一桌，格式為：<code class="bg-white px-1.5 py-0.5 rounded text-wedding-wine font-mono font-bold">桌次 | 桌名 | 賓客1, 賓客2...</code></p>
                </div>
                <div>
                    <label for="dataTextArea" class="block text-sm font-medium text-wedding-darkText mb-1">貼上或修改下方資料：</label>
                    <textarea id="dataTextArea" rows="10" 
                        class="w-full p-4 font-mono text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-wedding-gold/50 text-gray-800 leading-relaxed"></textarea>
                </div>
            </div>
            <div class="bg-gray-50 px-6 py-4 border-t border-gray-100 flex items-center justify-end space-x-3">
                <button onclick="closeEditModal()" class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium rounded-xl transition">取消</button>
                <button onclick="saveAndApplyData()" class="px-6 py-2.5 bg-wedding-wine hover:bg-wedding-wineDark text-white text-sm font-semibold rounded-xl shadow transition">儲存並更新系統</button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-wedding-darkText text-white/70 py-6 text-center text-xs mt-12 border-t border-wedding-gold/20">
        <div class="max-w-4xl mx-auto px-4 space-y-2">
            <p class="font-serif tracking-widest text-wedding-goldLight">Forever Love Wedding Celebration</p>
        </div>
    </footer>

            { tableNo: "第18桌", tableName: "有教無lèi", guests: ["周美宏", "徐東玲", "曾宜萱 (一)", "曾宜萱 (二,兒童椅)", "周韓華", "廖之瑜", "陳禹妡", "臧國玫", "胡雲惠", "張閏婷"] },
            { tableNo: "第17桌", tableName: "獅在博愛", guests: ["麥心怡", "劉怡君", "徐易瑋", "謝佩娟", "蔡如珮", "楊玉笙", "楊景舜", "黃斐瑄", "陳慧澐"] },
            { tableNo: "第19桌", tableName: "928的宿命", guests: ["鄭琇仁 (一)", "鄭琇仁 (二)", "陳宛儂", "林祈葦", "吳安榆", "林嘉慧 (一)", "林嘉慧 (二)", "林嘉慧 (三)", "林嘉慧 (四)"] }
        ];

        const TABLE_MAP_POSITIONS = {
            "主桌": { x: 12.5, y: 31, label: "主桌", isMain: true },
            "第1桌": { x: 8.5, y: 10 },
            "第2桌(素)": { x: 13.5, y: 10, altKey: "第2桌" },
            "第3桌": { x: 18.5, y: 10 },
            "第5桌": { x: 23.5, y: 10 },
            "第6桌": { x: 28.5, y: 10 },
            "第7桌": { x: 33.5, y: 10 },
            "第8桌": { x: 38.5, y: 10 },
            "第9桌": { x: 43.5, y: 10 },
            "第28桌": { x: 50.5, y: 10 },

            "第10桌": { x: 21.5, y: 28 },
            "第11桌": { x: 26.5, y: 28 },
            "第12桌": { x: 31.5, y: 28 },
            "第13桌": { x: 36.5, y: 28 },
            "第14桌": { x: 41.5, y: 28 },

            "第33桌": { x: 55.5, y: 23 },

            "第30桌": { x: 48.5, y: 38 },

            "第15桌": { x: 13.5, y: 56 },
            "第16桌(素)": { x: 18.5, y: 56, altKey: "第16桌" },
            "第17桌": { x: 23.5, y: 56 },

            "第31桌": { x: 48.5, y: 53 },
            "第35桌": { x: 55.5, y: 53 },

            "第27桌": { x: 7.5, y: 72 },
            "第26桌": { x: 12.5, y: 72 },
            "第25桌": { x: 17.5, y: 72 },
            "第24桌": { x: 22.5, y: 72 },
            "第23桌": { x: 27.5, y: 72 },
            "第22桌": { x: 32.5, y: 72 },
            "第21桌": { x: 37.5, y: 72 },

            "第32桌": { x: 48.5, y: 68 },
            "第36桌": { x: 55.5, y: 68 }
        };

        let weddingData = [];

        function initApp() {
            const savedData = localStorage.getItem('wedding_seating_data');
            if (savedData) {
                try {
                    weddingData = JSON.parse(savedData);
                } catch (e) {
                    weddingData = DEFAULT_WEDDING_DATA;
                }
            } else {
                weddingData = DEFAULT_WEDDING_DATA;
                saveToLocalStorage();
            }

            renderMapNodes();
            renderResults(weddingData);
            updateTotalCount();
        }

        function saveToLocalStorage() {
            localStorage.setItem('wedding_seating_data', JSON.stringify(weddingData));
        }

        function renderMapNodes() {
            const container = document.getElementById('mapNodesContainer');
            container.innerHTML = '';

            Object.keys(TABLE_MAP_POSITIONS).forEach(key => {
                const pos = TABLE_MAP_POSITIONS[key];
                const node = document.createElement('div');
                
                const isMain = pos.isMain;
                const sizeClass = isMain ? "w-10 h-10 sm:w-12 sm:h-12 text-xs font-bold" : "w-7 h-7 sm:w-9 sm:h-9 text-[11px]";
                
                node.className = `table-node absolute rounded-full border-2 border-wedding-wine/80 bg-white text-wedding-wine font-serif flex items-center justify-center shadow-md select-none transform -translate-x-1/2 -translate-y-1/2 ${sizeClass}`;
                node.style.left = `${pos.x}%`;
                node.style.top = `${pos.y}%`;
                
                let displayLabel = pos.label || key.replace('第', '').replace('桌', '').replace('(素)', '素');
                node.textContent = displayLabel;
                node.setAttribute('data-table', key);
                if (pos.altKey) node.setAttribute('data-alt-table', pos.altKey);

                node.onclick = () => {
                    const searchInput = document.getElementById('searchInput');
                    searchInput.value = key;
                    searchInput.dispatchEvent(new Event('input'));
                };

                container.appendChild(node);
            });
        }

        function updateMapHighlights(matchedTableNos) {
            const allNodes = document.querySelectorAll('.table-node');
            allNodes.forEach(node => {
                const tableAttr = node.getAttribute('data-table');
                const altAttr = node.getAttribute('data-alt-table');

                const isMatch = matchedTableNos.some(tn => 
                    tn === tableAttr || 
                    (altAttr && tn === altAttr) ||
                    tableAttr.includes(tn) ||
                    tn.includes(tableAttr)
                );

                if (isMatch) {
                    node.classList.add('active-highlight');
                } else {
                    node.classList.remove('active-highlight');
                }
            });
        }

        function renderResults(dataToRender, highlightKeyword = "") {
            const container = document.getElementById('resultsContainer');
            const noResultsEl = document.getElementById('noResults');
            const resultBadge = document.getElementById('resultCountBadge');
            
            container.innerHTML = '';

            const matchedTableNos = dataToRender.map(t => t.tableNo);
            updateMapHighlights(highlightKeyword ? matchedTableNos : []);

            if (dataToRender.length === 0) {
                noResultsEl.classList.remove('hidden');
                resultBadge.textContent = '找到 0 桌';
                return;
            } else {
                noResultsEl.classList.add('hidden');
                resultBadge.textContent = `共 ${dataToRender.length} 桌`;
            }

            dataToRender.forEach((table) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 shadow-md hover:shadow-lg transition gold-border flex flex-col justify-between relative overflow-hidden group";
                
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-24 h-24 bg-wedding-rose/50 rounded-bl-full -z-0 pointer-events-none transition group-hover:bg-wedding-roseAccent/60"></div>
                    
                    <div class="relative z-10">
                        <div class="flex items-start justify-between mb-4 pb-3 border-b border-wedding-rose">
                            <div>
                                <span class="inline-block bg-wedding-wine text-wedding-goldLight text-xs font-serif font-bold px-3 py-1 rounded-full shadow-sm mb-1.5">
                                    ${escapeHtml(table.tableNo)}
                                </span>
                                <h3 class="text-xl font-serif font-bold text-wedding-darkText">
                                    ${highlightText(table.tableName, highlightKeyword)}
                                </h3>
                            </div>
                            <div class="text-right text-xs text-gray-400 font-medium pt-1">
                                <i class="fa-solid fa-users mr-1 text-wedding-gold"></i>${table.guests.length} 位賓客
                            </div>
                        </div>

                        <div class="mb-2">
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">同桌賓客名單：</p>
                            <div class="flex flex-wrap gap-1.5">
                                ${table.guests.map(guest => {
                                    const isMatch = highlightKeyword && (
                                        guest.toLowerCase().includes(highlightKeyword.toLowerCase()) ||
                                        table.tableNo.toLowerCase().includes(highlightKeyword.toLowerCase()) ||
                                        table.tableName.toLowerCase().includes(highlightKeyword.toLowerCase())
                                    );
                                    const badgeClass = isMatch 
                                        ? "bg-wedding-wine text-wedding-goldLight font-bold ring-2 ring-wedding-gold shadow-sm px-3 py-1 rounded-xl text-sm" 
                                        : "bg-wedding-rose/70 text-wedding-darkText hover:bg-wedding-roseAccent/50 px-2.5 py-1 rounded-lg text-sm";
                                    return `<span class="${badgeClass} transition">${escapeHtml(guest)}</span>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function highlightText(text, keyword) {
            if (!keyword) return escapeHtml(text);
            const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedKeyword})`, 'gi');
            return escapeHtml(text).replace(regex, '<span class="bg-wedding-gold/40 text-wedding-wine px-1 rounded font-bold">$1</span>');
        }

        function updateTotalCount() {
            let totalTables = weddingData.length;
            let totalGuests = weddingData.reduce((sum, t) => sum + t.guests.length, 0);
            document.getElementById('totalSeatingCount').textContent = `總計：${totalTables} 桌 / 共 ${totalGuests} 位賓客`;
        }

        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }

            if (!query) {
                renderResults(weddingData);
                return;
            }

            const filtered = weddingData.filter(table => {
                const matchTableNo = table.tableNo.toLowerCase().includes(query.toLowerCase());
                const matchTableName = table.tableName.toLowerCase().includes(query.toLowerCase());
                const matchGuest = table.guests.some(g => g.toLowerCase().includes(query.toLowerCase()));
                return matchTableNo || matchTableName || matchGuest;
            });

            renderResults(filtered, query);
        });

        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderResults(weddingData);
            searchInput.focus();
        }

        clearSearchBtn.addEventListener('click', clearSearch);

        function openEditModal() {
            const textArea = document.getElementById('dataTextArea');
            let textOutput = weddingData.map(t => `${t.tableNo} | ${t.tableName} | ${t.guests.join(', ')}`).join('\n');
            textArea.value = textOutput;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveAndApplyData() {
            const rawText = document.getElementById('dataTextArea').value;
            const lines = rawText.split('\n');
            const newTableData = [];

            for (let line of lines) {
                if (!line.trim()) continue;
                let parts = line.split('|');
                if (parts.length >= 3) {
                    let tableNo = parts[0].trim();
                    let tableName = parts[1].trim();
                    let guestsStr = parts.slice(2).join(',');
                    let guests = guestsStr.split(/[,，、]/).map(g => g.trim()).filter(g => g.length > 0);
                    newTableData.push({ tableNo, tableName, guests });
                }
            }

            if (newTableData.length > 0) {
                weddingData = newTableData;
                saveToLocalStorage();
                renderResults(weddingData);
                updateTotalCount();
                closeEditModal();
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
            } else {
                alert('解析格式有誤，請確認每行包含「桌次 | 桌名 | 賓客1, 賓客2」。');
            }
        }

        function resetToDefault() {
            if (confirm('確定要恢復預設的婚宴資料嗎？')) {
                weddingData = DEFAULT_WEDDING_DATA;
                saveToLocalStorage();
                renderResults(weddingData);
                updateTotalCount();
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
            }
        }

        window.onload = function() {
            initApp();
        };
    </script>
